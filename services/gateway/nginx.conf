upstream auth_service {
    server auth-service:8001;
}
upstream item_service {
    server item-service:8002;
}
server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver — resolve upstream saat request masuk, bukan saat startup
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Auth Service routes
    # Auth Service metrics & health
    location /auth/health {
        set $upstream_auth auth-service:8001;
        proxy_pass http://$upstream_auth/health;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }
    location /auth/metrics {
        set $upstream_auth auth-service:8001;
        proxy_pass http://$upstream_auth/metrics;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
    location /auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Item Service health check
    # Item Service metrics & health
    location /items/health {
        set $upstream_item item-service:8002;
        proxy_pass http://$upstream_item/health;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }
    location /items/metrics {
        set $upstream_item item-service:8002;
        proxy_pass http://$upstream_item/metrics;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
    # Item Service routes
    location /items/ {
        proxy_pass http://item_service/items/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    # Item Service routes (without trailing slash)
    location /items {
        proxy_pass http://item_service/items;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Item Service — /products alias (frontend uses /products, backend uses /items)
    location /products {
        proxy_pass http://item_service/items;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /products/ {
        proxy_pass http://item_service/items/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Item Service — upload image endpoint
    location /upload-image {
        proxy_pass http://item_service/upload-image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 10M;
    }

    # Item Service — serve uploaded static files
    location /uploads/ {
        proxy_pass http://item_service/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check aggregator
    location /health {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' '*' always;
        return 200 '{"status": "healthy", "service": "ATHSNACK API"}';
    }

    # Frontend (static files)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}