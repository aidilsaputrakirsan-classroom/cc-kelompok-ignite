# ==============================================
# CI Pipeline — Ignite
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch main
# - Pull Request ke branch main
#
# Jobs:
# 1. test-backend: Install deps + run pytest
# 2. test-frontend: Install frontend + run tests
# 3. build-docker: Build Docker images

name: CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# Cancel workflow lama jika ada push baru
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================
  # JOB 1: Test Backend (FastAPI)
  # ================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: sqlite:///./test.db
      PYTHONPATH: .

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🗑️ Reset DB
        run: rm -f test.db

      - name: 🧪 Run tests with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=50

  # ================================
  # JOB 2: Test Frontend (React)
  # ================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test --if-present

      - name: 🏗️ Build frontend
        run: npm run build

  # ================================
  # JOB 3: Build Docker Images
  # ================================
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - test-frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build backend image
        run: docker build -t cloudapp-backend:ci ./backend

      - name: 🐳 Build frontend image
        run: docker build -t cloudapp-frontend:ci ./frontend

      - name: ✅ Build success
        run: |
          echo "✅ All Docker images built successfully!"
          docker images | grep cloudapp

  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ↑ HANYA deploy saat push ke main (bukan saat PR)

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚂 Install Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --project 3ec2162f-fc7a-4070-976a-65ea6b3ee926 --environment production --service backend backend --detach

      - name: 🚀 Deploy Frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --project 3ec2162f-fc7a-4070-976a-65ea6b3ee926 --environment production --service frontend frontend --detach
      - name: ✅ Deploy complete
        run: |
          echo "✅ Deployment successful!"
          echo "Backend: https://cc-kelompok-ignite-production.up.railway.app"
          echo "Frontend: https://aware-warmth-production-ebd3.up.railway.app"

# ── OPTIMASI 3: Notifikasi PR Comment ─────────────────────────
  notify:
    name: 💬 Notify PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    needs: [test-backend, test-frontend, build-docker]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Build status summary
        id: summary
        run: |
          BACKEND="${{ needs.test-backend.result }}"
          FRONTEND="${{ needs.test-frontend.result }}"
          DOCKER="${{ needs.build-docker.result }}"
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          B=$(icon "$BACKEND")
          F=$(icon "$FRONTEND")
          D=$(icon "$DOCKER")

          if [[ "$BACKEND" == "success" && "$FRONTEND" == "success" && "$DOCKER" == "success" ]]; then
            OVERALL="✅ **CI PASSED** — Semua tahap berhasil. PR aman untuk di-review & merge."
          else
            OVERALL="❌ **CI FAILED** — Ada tahap yang gagal. Perbaiki sebelum merge."
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          cat >> $GITHUB_OUTPUT <<END_OUTPUT
          body<<$EOF
          ## 🤖 CI Pipeline Report

          $OVERALL

          | Job | Status |
          |-----|--------|
          | 🐍 Test Backend | $B \`$BACKEND\` |
          | ⚛️ Test Frontend | $F \`$FRONTEND\` |
          | 🐳 Build Docker | $D \`$DOCKER\` |
          **Commit:** \`${{ github.sha }}\`
          **Triggered by:** @${{ github.actor }}
          **Workflow run:** [Lihat detail](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---
          *Komentar ini dibuat otomatis oleh CI pipeline.*
          $EOF
          END_OUTPUT

      - name: Find existing CI comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "🤖 CI Pipeline Report"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.summary.outputs.body }}
          edit-mode: replace