# ==============================================
# CI Pipeline — Ignite
# ==============================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint Backend (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
        
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./test.db
      PYTHONPATH: .
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - run: rm -f test.db
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=50

  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build

  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      # Build Microservices
      - name: Build Auth Service
        run: docker build -t auth-service:ci ./services/auth-service
      - name: Build Item Service
        run: docker build -t item-service:ci ./services/item-service
      - name: Build Gateway
        run: docker build -t gateway:ci ./services/gateway
      
      # Build Monolith (Compatibility)
      - name: Build Backend (Monolith)
        run: docker build -t cloudapp-backend:ci ./backend
      - name: Build Frontend
        run: docker build -t frontend:ci ./frontend

  # ================================
  # JOB 4: Deployment Summary (Tugas 11 — Lead CI/CD)
  # ================================
  deploy-summary:
    name: 🚀 Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    needs: [lint, test-backend, test-frontend, build-docker]
    if: always()
 
    steps:
      - name: 🕐 Generate timestamp
        id: timestamp
        run: |
          echo "value=$(TZ='Asia/Jakarta' date '+%d %B %Y, %H:%M:%S WIB')" >> $GITHUB_OUTPUT
 
      - name: 📋 Print deployment summary to job output
        run: |
          echo "=================================================="
          echo "🚀 DEPLOYMENT SUMMARY"
          echo "=================================================="
          echo ""
          echo "📦 Commit SHA  : ${{ github.sha }}"
          echo "🌿 Branch      : ${{ github.ref_name }}"
          echo "👤 Actor       : ${{ github.actor }}"
          echo "🕐 Timestamp   : ${{ steps.timestamp.outputs.value }}"
          echo ""
          echo "📊 CI Status:"
          echo "   • Lint         : ${{ needs.lint.result }}"
          echo "   • Test Backend : ${{ needs.test-backend.result }}"
          echo "   • Test Frontend: ${{ needs.test-frontend.result }}"
          echo "   • Build Docker : ${{ needs.build-docker.result }}"
          echo ""
          echo "🔗 Workflow Run:"
          echo "   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=================================================="
 
      - name: 💬 Post deployment summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lint     = "${{ needs.lint.result }}";
            const backend  = "${{ needs.test-backend.result }}";
            const frontend = "${{ needs.test-frontend.result }}";
            const docker   = "${{ needs.build-docker.result }}";
 
            const icon = (s) => ({
              success:   "✅",
              failure:   "❌",
              cancelled: "⚠️",
              skipped:   "⏭️",
            }[s] ?? "❓");
 
            const allGreen = [lint, backend, frontend, docker].every(s => s === "success");
            const overall  = allGreen
              ? "✅ **Semua tahap CI berhasil — siap untuk di-review!**"
              : "❌ **Ada tahap yang gagal — perbaiki sebelum merge.**";
 
            const sha     = "${{ github.sha }}";
            const shortSha = sha.substring(0, 7);
            const actor   = "${{ github.actor }}";
            const runUrl  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            const timestamp = "${{ steps.timestamp.outputs.value }}";
 
            const body = `## 🚀 CI/CD Deployment Summary
 
            ${overall}
 
            ### 📊 CI Status
            | Job | Status |
            |-----|--------|
            | 🔍 Lint Backend | ${icon(lint)} \`${lint}\` |
            | 🐍 Test Backend | ${icon(backend)} \`${backend}\` |
            | ⚛️ Test Frontend | ${icon(frontend)} \`${frontend}\` |
            | 🐳 Build Docker | ${icon(docker)} \`${docker}\` |
 
            ### 📦 Build Info
            - **Commit:** \`${shortSha}\` (${{ github.ref_name }})
            - **Triggered by:** @${actor}
            - **Timestamp:** ${timestamp}
            - **Workflow:** [Lihat detail](${runUrl})
 
            ---
            *Summary ini dibuat otomatis oleh CI pipeline.*`;
 
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
 
            const existing = comments.find(c =>
              c.user.login === "github-actions[bot]" &&
              c.body.includes("🚀 CI/CD Deployment Summary")
            );
 
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
