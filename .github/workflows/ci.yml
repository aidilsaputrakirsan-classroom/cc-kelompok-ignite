# ==============================================
# CI Pipeline — Ignite
# ==============================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint Backend (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
        
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./test.db
      PYTHONPATH: .
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - run: rm -f test.db
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=50

  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build

  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Auth Service
        run: docker build -t auth-service:ci ./services/auth-service
      - name: Build Item Service
        run: docker build -t item-service:ci ./services/item-service
      - name: Build Gateway
        run: docker build -t gateway:ci ./services/gateway
      - name: Build Frontend
        run: docker build -t frontend:ci ./frontend

  notify:
    name: 💬 Notify PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    needs: [test-backend, test-frontend, build-docker]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Build status summary
        id: summary
        run: |
          BACKEND="${{ needs.test-backend.result }}"
          FRONTEND="${{ needs.test-frontend.result }}"
          DOCKER="${{ needs.build-docker.result }}"
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }
          B=$(icon "$BACKEND")
          F=$(icon "$FRONTEND")
          D=$(icon "$DOCKER")
          if [[ "$BACKEND" == "success" && "$FRONTEND" == "success" && "$DOCKER" == "success" ]]; then
            OVERALL="✅ **CI PASSED** — Semua tahap berhasil. PR aman untuk di-review & merge."
          else
            OVERALL="❌ **CI FAILED** — Ada tahap yang gagal. Perbaiki sebelum merge."
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          cat >> $GITHUB_OUTPUT <<END_OUTPUT
          body<<$EOF
          ## 🤖 CI Pipeline Report

          $OVERALL

          | Job | Status |
          |-----|--------|
          | 🐍 Test Backend | $B \`$BACKEND\` |
          | ⚛️ Test Frontend | $F \`$FRONTEND\` |
          | 🐳 Build Docker | $D \`$DOCKER\` |
          **Commit:** \`${{ github.sha }}\`
          $EOF
          END_OUTPUT
      - uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "🤖 CI Pipeline Report"
      - uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.summary.outputs.body }}
          edit-mode: replace
