# ruff.toml - Konfigurasi dasar Ruff (Python Linter) untuk backend
# Disesuaikan dengan CI Pipeline Ignite (Python 3.12)

# Target versi Python
target-version = "py312"

# Panjang baris maksimum
line-length = 88

# Direktori yang di-exclude dari linting
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "dist",
    "build",
    "migrations",
    "test.db",
]

[lint]
# Aturan yang diaktifkan:
# E = pycodestyle errors
# F = pyflakes (undefined names, unused imports, dll)
# W = pycodestyle warnings
# I = isort (urutan import)
# B = flake8-bugbear (bug & design issues)
# UP = pyupgrade (modernisasi syntax Python)
select = ["E", "F", "W", "I", "B", "UP"]

# Aturan yang diabaikan:
# E501 = line too long (sudah ditangani oleh line-length)
# B008 = do not perform function calls in default argument (umum di FastAPI)
ignore = ["E501", "B008"]

# Izinkan autofix untuk aturan ini
fixable = ["I", "UP", "E", "W"]

# Tidak autofix untuk aturan berikut (harus diperbaiki manual)
unfixable = ["F"]

[lint.per-file-ignores]
# File test boleh menggunakan assert dan magic values
"tests/*" = ["S101", "PLR2004"]
"test_*.py" = ["S101", "PLR2004"]

[lint.isort]
# Urutkan import: stdlib → third-party → local
known-first-party = ["app", "backend"]
force-sort-within-sections = true

[format]
# Gunakan double quotes untuk string
quote-style = "double"
# Indentasi dengan spasi
indent-style = "space"